services:
  host-phpmyadmin:
    image: phpmyadmin:latest
    container_name: host-phpmyadmin
    restart: unless-stopped
    ports:
      - "5001:80"
    environment:
      PMA_HOSTS: ${PMA_HOSTS:?run update-container.sh, it writes this list to .env}
      UPLOAD_LIMIT: 5G
      PMA_ABSOLUTE_URI: https://host-myadmin.provo.edu/
      MAX_EXECUTION_TIME: 0
    volumes:
      # Apache caps request bodies at 1G by default; this lifts it so UPLOAD_LIMIT is the only cap
      - type: bind
        source: ./pma-limits.conf
        target: /etc/apache2/conf-enabled/pma-limits.conf
        read_only: true
        bind:
          # Without this, a missing file becomes an empty directory and Apache silently keeps the 1G cap
          create_host_path: false
    networks:
      - dbmanage-network
    logging:
      driver: syslog
      options:
        syslog-address: "udp://localhost:514"
        tag: "host-phpmyadmin"
networks:
  dbmanage-network:
    external: true
